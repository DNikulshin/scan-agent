name: ScanAgent

on:
  schedule:
    # ── Пиковые часы 07:00–10:00 МСК (04:00–07:00 UTC), каждые 30 мин ──
    - cron: "0,30 4,5,6 * * *"
    # ── Пиковые часы 17:00–20:00 МСК (14:00–17:00 UTC), каждые 30 мин ──
    - cron: "0,30 14,15,16 * * *"
    # ── Внепиковые часы, раз в 2 часа ──
    - cron: "0 0,2,8,10,12,18,20,22 * * *"
  workflow_dispatch: # ручной запуск из GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # - name: Restore DB cache
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: agent.db
      #     key: agent-db-${{ github.run_id }}
      #     restore-keys: |
      #       agent-db-

      - name: Install dependencies
        run: npm ci

      - name: Force regenerate Prisma Client
        run: |
          rm -rf node_modules/.prisma
          npx prisma generate

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KWORK_SEARCH_URL: ${{ secrets.KWORK_SEARCH_URL }}
          # ── FL.ru ──
          FL_ENABLED: ${{ secrets.FL_ENABLED }}
          FL_SEARCH_URL: ${{ secrets.FL_SEARCH_URL }}
          FL_GENERATE_PITCH: "false" # отклики пишем вручную
          FL_MAX_PAGES: "5" # ограничение минут Actions
          FL_ONLY_FREE_RESPONSES: ${{ secrets.FL_ONLY_FREE_RESPONSES }}
          # ── Freelance.ru ──
          FREELANCERU_ENABLED: ${{ secrets.FREELANCERU_ENABLED }}
          FREELANCERU_SEARCH_URL: ${{ secrets.FREELANCERU_SEARCH_URL }}
          # ── Habr ──
          HABR_ENABLED: ${{ secrets.HABR_ENABLED }}
          HABR_SEARCH_URL: ${{ secrets.HABR_SEARCH_URL }}
          # ── HH.ru ──
          HH_ENABLED: ${{ secrets.HH_ENABLED }}
          HH_SEARCH_URL: ${{ secrets.HH_SEARCH_URL }}
          HH_MAX_PAGES: ${{ secrets.HH_MAX_PAGES }}
          HH_MIN_KEYWORD_SCORE: ${{ secrets.HH_MIN_KEYWORD_SCORE }}
          # ── БД (Prisma Postgres, pooled URL — cron-агенту LISTEN не нужен) ──
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # ── GitHub профиль (Блок 2: динамический ProfileSnapshot) ──
          # GH_PROFILE_LOGIN — не секрет, через vars; если пусто — fallback на static profile.ts.
          # Префикс GH_ а не GITHUB_, потому что GitHub блокирует пользовательские vars/secrets с GITHUB_*.
          GH_PROFILE_LOGIN: ${{ vars.GH_PROFILE_LOGIN }}
          # Встроенный токен GHA: 5000 req/час, public_repo scope из коробки.
          GH_PROFILE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Profile snapshots: FL/Kwork/Freelance.ru (Блок 2 расширение) ──
          # HH заливается вручную через dashboard /profile (Cloudflare Lux SPA не парсится).
          FL_PROFILE_URL: ${{ vars.FL_PROFILE_URL }}
          KWORK_PROFILE_URL: ${{ vars.KWORK_PROFILE_URL }}
          FREELANCERU_PROFILE_URL: ${{ vars.FREELANCERU_PROFILE_URL }}
        run: npx tsx src/index.ts

      # - name: Upload agent.db for analysis
      #   if: always()
      #   uses: actions/upload-artifact@v4
